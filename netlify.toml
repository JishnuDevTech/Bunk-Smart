[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # FRONTEND_URL is the site's own public URL (also referenced in README.md),
  # not a sensitive secret, so it's excluded from secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "FRONTEND_URL"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/google/:action"
  to = "/.netlify/functions/google-:action"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
